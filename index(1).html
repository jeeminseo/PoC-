<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 물류 운영 PoC 센터</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f8f9fa;
            color: #212529;
            padding: 40px 20px;
            text-align: center;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 12px;
        }
        p {
            color: #6c757d;
            margin-bottom: 30px;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
        }
        .poc-card {
            background: #ffffff;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            text-align: left;
        }
        .poc-card h3 {
            font-size: 18px;
            margin-bottom: 8px;
        }
        .poc-card a {
            display: inline-block;
            margin-top: 10px;
            color: #0d6efd;
            text-decoration: none;
            font-weight: bold;
        }
        .poc-card a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <h1>AI 물류 운영 컨설팅 PoC 센터</h1>
    <p>테스트할 PoC 프로그램을 선택하세요.</p>
    
    <div class="container">
        <div class="poc-card">
            <h3>PoC 1: AI 재고 재배치 시뮬레이터</h3>
            <a href="./poc1/">프로그램 실행하기 &rarr;</a>
        </div>

        <div class="poc-card">
            <h3>PoC 2: 비정형 발주서 AI 자동 분석</h3>
            <a href="./poc2/">프로그램 실행하기 &rarr;</a>
        </div>
    </div>
</body>
</html>
